<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Preview: KloBraticc profile README (Material 3 Expressive)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  body.light {
    background: #ffffff; color: #1f2328;
  }
  .page { max-width: 1012px; margin: 0 auto; padding: 0 16px 64px; }
  .banner {
    padding: 24px 0 16px; border-bottom: 1px solid #30363d;
    display: flex; gap: 24px; align-items: flex-end; margin-bottom: 24px;
  }
  body.light .banner { border-bottom-color: #d1d9e0; }
  .avatar { width: 296px; height: 296px; border-radius: 50%; border: 1px solid #30363d;
    display:flex; align-items:center; justify-content:center; font-size:120px; background:#161b22; flex:none; }
  body.light .avatar { background:#f6f8fa; border-color:#d1d9e0; }
  h1.vcard { font-size: 24px; font-weight: 600; color: #e6edf3; margin: 0 0 4px; }
  body.light h1.vcard { color: #1f2328; }
  .login { font-size: 20px; font-weight: 300; color: #7d8590; }
  .bio { margin: 12px 0; }
  .meta { color: #7d8590; font-size: 14px; margin: 4px 0; }
  .followers { font-size: 14px; margin-top: 10px; }
  .followers b { color: #e6edf3; }
  body.light .followers b { color: #1f2328; }
  .pill { display:inline-block; padding:0 7px; border:1px solid #30363d; border-radius:2em; font-size:12px; color:#7d8590; margin-right:4px;}
  body.light .pill { border-color:#d1d9e0; }
  .md { max-width: 888px; margin: 0 auto; text-align: center; }
  .md img { max-width: 100%; }
  .pills { display:flex; justify-content:center; gap:16px; margin:20px 0; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="page">

  <div class="md">
    <p>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="assets/hero-dark.svg"/>
        <img src="assets/hero-light.svg" width="100%" alt="KloBratic"/>
      </picture>
    </p>

    <p>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="assets/activity-dark.svg"/>
        <img src="assets/activity-light.svg" width="100%" alt="GitHub activity"/>
      </picture>
    </p>

    <p>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="assets/streak-dark.svg"/>
        <img src="assets/streak-light.svg" width="100%" alt="Streak"/>
      </picture>
    </p>

    <p>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="assets/projects-dark.svg"/>
        <img src="assets/projects-light.svg" width="100%" alt="Projects"/>
      </picture>
    </p>

    <p>
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="assets/wave-dark.svg"/>
        <img src="assets/wave-light.svg" width="100%" alt=""/>
      </picture>
    </p>

    <p style="margin-top:10px;">
      <a href="https://metawka.github.io/expressive-profile/">
        <picture>
          <source media="(prefers-color-scheme: dark)" srcset="assets/credit-dark.svg"/>
          <img src="assets/credit-light.svg" width="380" alt="inspiration from expressive profile (mally)"/>
        </picture>
      </a>
    </p>
  </div>

</div>
</body>
</html>
